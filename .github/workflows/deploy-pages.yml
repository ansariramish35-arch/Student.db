name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build placeholder only. GitHub Pages cannot run the API/backend.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build static export
        run: npm run build

      # If Pages is still set to "Deploy from a branch", publish the generated
      # export at the repository root as well. Restrict push triggers above to
      # source/config paths so this generated-output commit does not loop.
      - name: Publish static files for branch-based Pages
        run: |
          set -e
          rm -rf _next _not-found 404
          rm -f index.html index.txt 404.html __next.__PAGE__.txt __next._full.txt __next._head.txt __next._tree.txt __next._index.txt
          cp -a out/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll index.html index.txt 404.html 404 _not-found _next __next.__PAGE__.txt __next._full.txt __next._head.txt __next._tree.txt __next._index.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated static site"
            git push origin HEAD:main
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
