name: Build and publish static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: student-db-static-export
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build placeholder only. GitHub Pages cannot run the API/backend.
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static export
        run: npm run build
      - name: Publish static files for branch-based Pages
        run: |
          set -e
          rm -rf _next _not-found 404
          rm -f index.html index.txt 404.html __next.__PAGE__.txt __next._full.txt __next._head.txt __next._tree.txt __next._index.txt
          cp -a out/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll index.html index.txt 404.html 404 _not-found _next __next.__PAGE__.txt __next._full.txt __next._head.txt __next._tree.txt __next._index.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated static site"
            git push origin HEAD:main
          fi
